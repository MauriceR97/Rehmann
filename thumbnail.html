<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;padding:0;}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden;font-family:'Fira Sans',Arial,sans-serif;}
  .main{width:75%;background:var(--reh-red);display:flex;align-items:center;justify-content:center;}
  .main .mark{font-weight:800;color:#fff;font-size:150px;line-height:1;letter-spacing:-2px;}
  .main .mark small{display:block;font-size:60px;font-weight:600;letter-spacing:0;margin-top:8px;color:rgba(255,255,255,0.92);}
  .strip{width:25%;display:flex;flex-direction:column;}
  .strip div{flex:1;}
</style>
</head>
<body>
  <div class="tile">
    <div class="main">
      <div class="mark">Rehmann<small>Interliving</small></div>
    </div>
    <div class="strip">
      <div style="background:var(--gold-500);"></div>
      <div style="background:var(--green-500);"></div>
      <div style="background:var(--navy-500);"></div>
    </div>
  </div>
</body>
</html>
