<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Räumungsverkauf – Möbel Rehmann</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { max-width: 100%; overflow-x: clip; }
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans, "Fira Sans", Arial, sans-serif); }
  a { color: var(--reh-red); }
  a:hover { color: var(--red-600); }
  @keyframes rvTicker { from { transform: translateX(0); } to { transform: translateX(-33.333%); } }
  @media (prefers-reduced-motion: reduce) { [style*="rvTicker"] { animation: none !important; } }
  @media (max-width: 720px) { .rv-foot { grid-template-columns: 1fr !important; } .rv-cats { grid-template-columns: repeat(3, 1fr) !important; } }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
  <script src="config.js"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
